name: Publish wrappers

env:
  NWG_NOT_NIGHTLY: true

on:
  release: 
    types: published

jobs:
  build:
    permissions:
      id-token: write

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup .NET
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        global-json-file: global.json
    - name: Restore dependencies (root)
      run: dotnet restore
    - name: Generate wrappers
      run: "pwsh \"${{ github.workspace }}\\GenerateNativeWrapper.ps1\""
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Submit NuGet packages
      run: "dotnet nuget push \"${{ github.workspace }}\\bin\\*.nupkg\" --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}"
    - name: Publish artefact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
      with:
        name: For_player.zip
        path: "${{ github.workspace }}\\bin\\NativeWrapper.zip"
        if-no-files-found: warn
        archive: false

        

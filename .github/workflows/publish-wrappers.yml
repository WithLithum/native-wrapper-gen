name: Publish wrappers

env:
  NWG_NOT_NIGHTLY: true

on:
  push:
    tags:
      - v**

jobs:
  build:
    permissions:
      id-token: write
      contents: write

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup .NET
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        global-json-file: global.json
    - name: Restore dependencies (root)
      run: dotnet restore
    - name: Generate wrappers
      run: "pwsh \"${{ github.workspace }}\\GenerateNativeWrapper.ps1\""
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Submit NuGet packages
      run: "dotnet nuget push \"${{ github.workspace }}\\bin\\*.nupkg\" --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}"
    - name: Publish release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      with:
        draft: true
        tag_name: ${{ github.ref_name }}
        files: "${{ github.workspace }}\\bin\\NativeWrapper.zip"
        
